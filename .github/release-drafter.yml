# release-drafter is used ONLY for autolabeling: label-prs.yml triggers it on
# pull_request_target, which applies labels from the PR title's
# conventional-commit prefix and never creates drafts or releases. Disable
# the releaser explicitly in the workflow, not here. Label names must stay in
# sync with .github/release.yml, which consumes them for release-note
# grouping.
#
# The breaking regexes exclude a trailing "!" so they cannot double-match:
# release-drafter applies EVERY matching label, so "feat!:" would otherwise
# earn both "breaking" and "feat", and the notes generator would list the PR
# under both categories.
autolabeler:
  - label: breaking
    title: '/^feat(\([^)]*\))?!:/'
  - label: breaking
    title: '/^fix(\([^)]*\))?!:/'
  - label: breaking
    title: '/^perf(\([^)]*\))?!:/'
  - label: breaking
    title: '/^refactor(\([^)]*\))?!:/'
  - label: feat
    title: '/^feat(\([^)]*\))?:/'
  - label: fix
    title: '/^fix(\([^)]*\))?:/'
  - label: perf
    title: '/^perf(\([^)]*\))?:/'
  - label: ci
    title: '/^ci(\([^)]*\))?:/'
  - label: docs
    title: '/^docs(\([^)]*\))?:/'
  - label: test
    title: '/^test(\([^)]*\))?:/'
  - label: refactor
    title: '/^refactor(\([^)]*\))?:/'
  - label: chore
    title: '/^chore(\([^)]*\))?:/'
